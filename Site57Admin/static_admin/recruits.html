<!-- simple admin recruits UI -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin Recrutement - Site57</title>
    <style>body{font-family:Arial;max-width:1000px;margin:10px auto;padding:0 10px}label{display:block;margin-top:6px}textarea{width:100%;height:80px}</style>
  </head>
  <body>
    <h1>Admin - Recrutement</h1>
    <div>
      <h2>Créer une offre</h2>
      <label>Titre <input id="title"></label>
      <label>Description <textarea id="description"></textarea></label>
      <button id="create">Créer</button>
      <div id="msg"></div>
    </div>
    <hr />
    <div>
      <h2>Offres existantes</h2>
      <div id="offers"></div>
    </div>
    <hr />
    <div>
      <h2>Candidatures</h2>
      <label>Offre filter id <input id="filter_offer" style="width:60px"></label>
      <button id="list_apps">Lister</button>
      <div id="apps"></div>
    </div>

    <script>
      const token = prompt('Admin token (X-Admin-Token)');
      async function createOffer(){
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const res = await fetch('/api/offers', {method:'POST', headers: {'Content-Type':'application/json','X-Admin-Token': token}, body: JSON.stringify({title, description})});
        const data = await res.json();
        document.getElementById('msg').textContent = JSON.stringify(data);
        loadOffers();
      }
      async function loadOffers(){
        const res = await fetch('/api/offers?open=false');
        const offers = await res.json();
        const container = document.getElementById('offers'); container.innerHTML='';
        offers.forEach(o=>{
          const el = document.createElement('div'); el.innerHTML = `<b>${o.id} - ${o.title}</b> - ${o.status||'open'} <button data-id="${o.id}">Suppr</button>`;
          container.appendChild(el);
          el.querySelector('button').addEventListener('click', ()=>deleteOffer(o.id));
        });
      }
      async function deleteOffer(id){
        const res = await fetch('/api/offers/'+id, {method:'DELETE', headers:{'X-Admin-Token': token}});
        const data = await res.json();
        alert(JSON.stringify(data));
        loadOffers();
      }
      async function listApps(){
        const offer = document.getElementById('filter_offer').value;
        const q = offer? '?offer='+offer : '';
        const res = await fetch('/api/applications'+q, {headers:{'X-Admin-Token': token}});
        const apps = await res.json();
        const container = document.getElementById('apps'); container.innerHTML='';
        apps.forEach(a=>{
          const el = document.createElement('div'); el.innerHTML = `<b>#${a.id}</b> ${a.name} (${a.email}) - ${a.status} <button data-id="${a.id}">Voir</button>`;
          container.appendChild(el);
          el.querySelector('button').addEventListener('click', ()=>showApp(a.id));
        });
      }
      async function showApp(id){
        const res = await fetch('/api/applications/'+id, {headers:{'X-Admin-Token': token}});
        const a = await res.json();
        alert(JSON.stringify(a, null, 2));
      }
      document.getElementById('create').addEventListener('click', createOffer);
      document.getElementById('list_apps').addEventListener('click', listApps);
      loadOffers();
    </script>
  </body>
</html>
