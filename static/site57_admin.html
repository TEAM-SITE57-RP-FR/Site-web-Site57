<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site-57 — Panneau Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0908; --bg-raised:#14100d;
  --paper:#ded7c4; --paper-dim:#bcb49c; --ink:#1c1a14;
  --amber:#c98a2c; --red:#8a2b1f; --green:#3c5c3c; --blue-grey:#4a4a5c;
  --line: rgba(222,215,196,0.18); --line-strong: rgba(222,215,196,0.35);
  --font-stamp:'Courier Prime', monospace;
  --font-body:'Libre Baskerville', serif;
  --font-eyebrow:'Oswald', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 15% 0%, rgba(138,43,31,0.14), transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(40,30,20,0.3), transparent 60%),
    var(--bg);
  color:var(--paper); font-family:var(--font-body); min-height:100vh; line-height:1.5;
}
::selection{background:var(--red);color:var(--paper);}
button{font-family:var(--font-eyebrow);cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
.stamp{font-family:var(--font-stamp);letter-spacing:.03em;}

header.top{
  border-bottom:2px solid var(--red);
  padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:12px; position:sticky; top:0; background:var(--bg); z-index:50;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .mark{
  width:44px;height:44px;border:2px solid var(--red);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-stamp);font-weight:700;color:var(--red);font-size:13px;
}
.brand h1{font-family:var(--font-eyebrow);font-size:19px;letter-spacing:.06em;margin:0;text-transform:uppercase;}
.brand small{display:block;font-family:var(--font-stamp);font-size:10.5px;color:var(--paper-dim);}
.id-card{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);
  padding:6px 12px;background:rgba(255,255,255,0.03);
}
.id-card .who{font-family:var(--font-stamp);font-size:12px;}
.id-card button{background:transparent;border:1px solid var(--line-strong);color:var(--paper);padding:4px 10px;font-size:11px;text-transform:uppercase;}
.id-card button:hover{border-color:var(--red);color:var(--red);}

.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);padding:0 28px;flex-wrap:wrap;}
.subnav button{
  background:transparent;border:none;color:var(--paper-dim);padding:12px 18px;
  font-size:12px;text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid transparent;
}
.subnav button.active{color:var(--paper);border-bottom-color:var(--red);font-weight:600;}
.subnav button:hover{color:var(--paper);}

main{padding:30px 40px;max-width:920px;margin:0 auto;}
.panel-title h2{font-family:var(--font-eyebrow);text-transform:uppercase;letter-spacing:.05em;font-size:24px;margin:0 0 6px;}
.panel-sub{color:var(--paper-dim);font-size:13.5px;margin-bottom:24px;font-style:italic;}

.card{border:1px solid var(--line-strong);background:rgba(255,255,255,0.02);padding:18px 20px;margin-bottom:14px;position:relative;}
.card h3{margin:0 0 6px;font-family:var(--font-eyebrow);font-size:16px;text-transform:uppercase;}
.card .meta{font-family:var(--font-stamp);font-size:11px;color:var(--paper-dim);margin-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-stamp);font-size:10.5px;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-strong);}
.badge .dot{width:7px;height:7px;border-radius:50%;}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{background:transparent;border:1px solid var(--paper-dim);color:var(--paper);padding:8px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;}
.btn:hover{border-color:var(--red);color:var(--red);}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--paper);font-weight:700;}
.btn.primary:hover{background:#a5382a;}
.btn.warn{border-color:#b98a1f;color:#d8a53a;}
.btn.warn:hover{background:#b98a1f;color:var(--ink);}
.btn.small{padding:5px 10px;font-size:10.5px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

input[type=text],input[type=password],input[type=number],textarea,select{
  background:rgba(255,255,255,0.04);border:1px solid var(--line-strong);color:var(--paper);padding:9px 11px;font-size:13.5px;width:100%;
}
textarea{min-height:80px;resize:vertical;}
label{display:block;font-family:var(--font-eyebrow);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-dim);margin:12px 0 5px;}
.form{border:1px dashed var(--line-strong);padding:18px;margin-bottom:22px;background:rgba(255,255,255,0.015);}
.form-title{font-family:var(--font-stamp);font-size:11.5px;color:var(--red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.empty{color:var(--paper-dim);font-style:italic;font-size:13.5px;padding:18px 0;}

.login-wrap{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:40px;}
.login-card{width:380px;border:1px solid var(--red);padding:30px 28px;background:linear-gradient(180deg, rgba(138,43,31,0.08), transparent);position:relative;}
.login-card::before{
  content:"NIVEAU 5"; position:absolute;top:14px;right:-34px;transform:rotate(45deg);
  background:var(--red);color:var(--paper);font-family:var(--font-stamp);font-size:10px;letter-spacing:.1em;padding:3px 42px;
}
.login-card h2{font-family:var(--font-eyebrow);text-transform:uppercase;margin:0 0 4px;font-size:19px;}
.login-card .hint{font-family:var(--font-stamp);font-size:11px;color:var(--paper-dim);margin-bottom:18px;line-height:1.6;}
.errmsg{color:#e07a5f;font-family:var(--font-stamp);font-size:11.5px;margin-top:8px;min-height:14px;}

.log-line{font-family:var(--font-stamp);font-size:12px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.log-line .tag{padding:1px 7px;font-size:10px;text-transform:uppercase;}
.tag.ban{background:var(--red);color:var(--paper);}
.tag.kick{background:var(--amber);color:var(--ink);}
.tag.warn{background:#7a6a20;color:var(--paper);}
.log-line .when{color:var(--paper-dim);margin-left:auto;}

.linkrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.linkrow input{flex:1;}

.denied{max-width:480px;margin:80px auto;text-align:center;}
.denied h2{font-family:var(--font-eyebrow);text-transform:uppercase;color:var(--red);}
@media(max-width:820px){ main{padding:20px 16px;} .subnav{padding:0 10px;} }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">57</div>
    <div>
      <h1><span data-site-name>Site-57</span> — Admin</h1>
      <small class="stamp">Panneau de contrôle — accès restreint au personnel autorisé</small>
    </div>
  </div>
  <div id="authArea"></div>
</header>

<div id="shellArea"></div>

<script src="site57_core.js"></script>
<script>
let session = null;
let adminTab = 'config';

const ADMIN_TABS = [
  {id:'config', label:'Configuration'},
  {id:'roles', label:'Rôles'},
  {id:'users', label:'Utilisateurs & sanctions'},
  {id:'annonces', label:'Annonces'}
];

function setAdminTab(id){ adminTab = id; render(); }

function render(){
  renderAuthArea();
  const shell = document.getElementById('shellArea');
  if(!session){
    shell.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  if(!hasPerm(session, 'moderate')){
    shell.innerHTML = `
      <div class="denied">
        <h2>Accès refusé</h2>
        <p style="font-size:13.5px;">Le compte <b>${esc(session.username)}</b> ne dispose pas des permissions nécessaires pour accéder au panneau Admin.</p>
        <button class="btn" id="deniedLogout">↩ Déconnexion</button>
      </div>`;
    document.getElementById('deniedLogout').onclick = ()=>{ session=null; render(); };
    return;
  }
  shell.innerHTML = `
    <nav class="subnav">
      ${ADMIN_TABS.map(t=>`<button data-atab="${t.id}" class="${adminTab===t.id?'active':''}">${t.label}</button>`).join('')}
      <button data-atab="__logout" style="margin-left:auto;color:#e07a5f;">↩ Déconnexion</button>
    </nav>
    <main id="mainArea"></main>
  `;
  shell.querySelectorAll('.subnav button').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.atab==='__logout'){ session=null; render(); return; }
    setAdminTab(b.dataset.atab);
  }));
  const main = document.getElementById('mainArea');
  const renderers = { config: renderConfig, roles: renderRolesAdmin, users: renderUsersAdmin, annonces: renderAnnoncesAdmin };
  main.innerHTML = (renderers[adminTab]||renderConfig)();
  attachAdminHandlers(adminTab);
}

function renderAuthArea(){
  const el = document.getElementById('authArea');
  if(!session){ el.innerHTML=''; return; }
  const r = role(session.role);
  el.innerHTML = `
    <div class="id-card">
      <span class="badge stamp"><span class="dot" style="background:${r?r.color:'#666'}"></span>${esc(r?r.name:'?')}</span>
      <span class="who">${esc(session.username)}</span>
    </div>`;
}

/* ---------- Connexion ---------- */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <h2>Panneau Admin</h2>
      <div class="hint">Seuls les comptes avec un rôle disposant de la permission <b>moderate</b> (ou <b>all</b>) peuvent entrer ici.<br>Compte de démonstration : <b>developeur1234</b> / <b>developeur1234</b>.</div>
      <label>Identifiant</label>
      <input type="text" id="f-user">
      <label>Mot de passe</label>
      <input type="password" id="f-pass">
      <div class="row" style="margin-top:16px;">
        <button class="btn primary" id="f-submit" style="flex:1;">Se connecter</button>
      </div>
      <div class="errmsg" id="f-err"></div>
    </div>
  </div>`;
}
function attachLoginHandlers(){
  document.getElementById('f-submit').onclick = ()=>{
    const uname = document.getElementById('f-user').value.trim();
    const pass = document.getElementById('f-pass').value;
    const err = document.getElementById('f-err');
    const u = user(uname);
    if(!u || u.password!==pass){ err.textContent='Identifiants invalides.'; return; }
    if(u.status==='banni'){ err.textContent='Ce compte est banni.'; return; }
    session = u; render();
  };
}

/* ---------- Configuration du site ---------- */
function renderConfig(){
  const c = DB.config;
  return `
  <div class="panel-title"><h2>Configuration du site</h2></div>
  <p class="panel-sub">Nom, devise, liens et bannière d'annonce affichés sur l'espace Membre.</p>
  <div class="card">
    <h3>Identité du site</h3>
    <label>Nom du site</label><input type="text" id="cf-name" value="${esc(c.siteName)}">
    <label>Devise / sous-titre</label><input type="text" id="cf-tagline" value="${esc(c.tagline)}">
    <button class="btn primary" id="cf-save-identity" style="margin-top:12px;">Enregistrer</button>
  </div>
  <div class="card">
    <h3>Bannière d'annonce</h3>
    <p class="meta">Affichée en haut de l'espace Membre lorsqu'elle est activée.</p>
    <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-family:var(--font-body);">
      <input type="checkbox" id="cf-banner-active" style="width:auto;" ${c.banner.active?'checked':''}> Activer la bannière
    </label>
    <label>Texte de la bannière</label><textarea id="cf-banner-text">${esc(c.banner.text)}</textarea>
    <button class="btn primary" id="cf-save-banner" style="margin-top:12px;">Publier la bannière</button>
  </div>
  <div class="card">
    <h3>Liens affichés</h3>
    <div id="cf-links">
      ${c.links.map((l,i)=>`
        <div class="linkrow">
          <input type="text" data-link-label="${i}" value="${esc(l.label)}" placeholder="Libellé">
          <input type="text" data-link-url="${i}" value="${esc(l.url)}" placeholder="https://…">
          <button class="btn small" data-del-link="${i}">Retirer</button>
        </div>`).join('') || '<div class="empty">Aucun lien pour le moment.</div>'}
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="btn small" id="cf-add-link">+ Ajouter un lien</button>
      <button class="btn primary" id="cf-save-links">Enregistrer les liens</button>
    </div>
  </div>`;
}

/* ---------- Rôles ---------- */
function renderRolesAdmin(){
  const canManage = hasPerm(session, 'roles');
  const sorted = [...DB.roles].sort((a,b)=>a.order-b.order);
  return `
  <div class="panel-title"><h2>Rôles</h2></div>
  <p class="panel-sub">${canManage ? 'Créez et attribuez les rôles du personnel.' : 'Vous pouvez consulter les rôles, mais pas les modifier (permission « roles » requise).'}</p>
  ${canManage?`
  <div class="form">
    <div class="form-title">Créer un nouveau rôle</div>
    <label>Nom du rôle</label><input type="text" id="nr-name" placeholder="ex : Archiviste">
    <label>Couleur</label><input type="text" id="nr-color" value="#4a4a6a">
    <label>Description</label><textarea id="nr-desc"></textarea>
    <label>Permissions</label>
    <div class="row" id="nr-perms">
      ${['roles','users','recruitment','articles','announcements','ideas','shop','moderate'].map(p=>`
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-family:var(--font-body);font-size:13px;">
          <input type="checkbox" value="${p}" style="width:auto;"> ${p}
        </label>`).join('')}
    </div>
    <button class="btn primary" id="nr-submit" style="margin-top:12px;">Créer le rôle</button>
  </div>
  <div class="form">
    <div class="form-title">Attribuer un rôle</div>
    <div class="row">
      <select id="ar-user" style="flex:2;">${DB.users.map(u=>`<option value="${u.username}">${esc(u.username)}</option>`).join('')}</select>
      <select id="ar-role" style="flex:1;">${DB.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>
      <button class="btn primary" id="ar-submit">Attribuer</button>
    </div>
  </div>`:''}
  ${sorted.map(r=>`
    <div class="card">
      <span class="badge" style="position:absolute;top:14px;right:16px;"><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</span>
      <h3>${esc(r.name)}</h3>
      <p class="meta">ID : ${r.id} · Permissions : ${r.perms.includes('all')?'TOUTES':(r.perms.join(', ')||'aucune')}</p>
      <p style="font-size:13px;">${esc(r.desc)}</p>
      ${canManage && r.id!=='developpeur' ? `<button class="btn small" data-del-role="${r.id}" style="border-color:var(--red);color:var(--red);">Supprimer ce rôle</button>` : ''}
    </div>`).join('')}
  `;
}

/* ---------- Utilisateurs & sanctions ---------- */
function renderUsersAdmin(){
  return `
  <div class="panel-title"><h2>Utilisateurs &amp; sanctions</h2></div>
  <p class="panel-sub">Avertissements, exclusions et bannissements du personnel.</p>
  ${DB.users.map(u=>{
    const r = role(u.role);
    return `
    <div class="card">
      <span class="badge" style="position:absolute;top:14px;right:16px;">${u.status.toUpperCase()}</span>
      <h3>${esc(u.username)} <span class="badge" style="margin-left:8px;"><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</span></h3>
      <p class="meta">Crédits : ${u.credits} · Avertissements : ${u.warnings.length} · Inscrit le ${u.joined}</p>
      ${u.username!=='developeur1234'?`
      <div class="row">
        <button class="btn small warn" data-warn="${u.username}">Avertir</button>
        <button class="btn small" data-kick="${u.username}">Exclure (kick)</button>
        <button class="btn small" data-ban="${u.username}" style="border-color:var(--red);color:var(--red);" ${u.status==='banni'?'disabled':''}>Bannir</button>
        ${u.status==='banni'?`<button class="btn small" data-unban="${u.username}">Lever le bannissement</button>`:''}
      </div>`:'<div class="meta stamp">Compte protégé — action impossible.</div>'}
    </div>`;
  }).join('')}
  <h3 style="font-family:var(--font-eyebrow);text-transform:uppercase;font-size:15px;margin-top:30px;">Journal des sanctions (salon de logs)</h3>
  <div class="card">
    ${DB.logs.slice().reverse().map(l=>`
      <div class="log-line">
        <span class="tag ${l.type}">${l.type}</span>
        <span><b>${esc(l.moderator)}</b> → <b>${esc(l.target)}</b> : ${esc(l.reason)}</span>
        <span class="when">${l.date}</span>
      </div>`).join('') || '<div class="empty">Aucune sanction enregistrée.</div>'}
  </div>`;
}

/* ---------- Annonces rapides ---------- */
function renderAnnoncesAdmin(){
  return `
  <div class="panel-title"><h2>Annonces</h2></div>
  <p class="panel-sub">Publiez un bulletin, visible immédiatement sur l'espace Membre.</p>
  <div class="form">
    <div class="form-title">Publier une annonce</div>
    <label>Titre</label><input type="text" id="an-title">
    <label>Message</label><textarea id="an-content"></textarea>
    <button class="btn primary" id="an-submit" style="margin-top:10px;">Publier</button>
  </div>
  ${DB.announcements.slice().reverse().map(a=>`
    <div class="card">
      <h3>${esc(a.title)}</h3>
      <p class="meta">${a.date}</p>
      <p style="font-size:13.5px;white-space:pre-wrap;">${esc(a.content)}</p>
      <button class="btn small" data-del-an="${a.id}" style="border-color:var(--red);color:var(--red);">Supprimer</button>
    </div>`).join('') || '<div class="empty">Aucune annonce.</div>'}
  `;
}

/* ---------- Handlers ---------- */
function attachAdminHandlers(tab){
  const main = document.getElementById('mainArea');

  if(tab==='config'){
    document.getElementById('cf-save-identity').onclick = async ()=>{
      DB.config.siteName = document.getElementById('cf-name').value.trim() || 'Site-57';
      DB.config.tagline = document.getElementById('cf-tagline').value.trim();
      await saveConfig(); applyBranding(); render();
    };
    document.getElementById('cf-save-banner').onclick = async ()=>{
      DB.config.banner.active = document.getElementById('cf-banner-active').checked;
      DB.config.banner.text = document.getElementById('cf-banner-text').value.trim();
      await saveConfig(); render();
    };
    document.getElementById('cf-add-link').onclick = ()=>{
      DB.config.links.push({label:'', url:''}); render();
    };
    main.querySelectorAll('[data-del-link]').forEach(b=>b.onclick=async()=>{
      DB.config.links.splice(parseInt(b.dataset.delLink),1);
      await saveConfig(); render();
    });
    document.getElementById('cf-save-links').onclick = async ()=>{
      main.querySelectorAll('[data-link-label]').forEach(inp=>{
        DB.config.links[parseInt(inp.dataset.linkLabel)].label = inp.value.trim();
      });
      main.querySelectorAll('[data-link-url]').forEach(inp=>{
        DB.config.links[parseInt(inp.dataset.linkUrl)].url = inp.value.trim();
      });
      await saveConfig(); render();
    };
  }

  if(tab==='roles'){
    const submit = document.getElementById('nr-submit');
    if(submit) submit.onclick = async ()=>{
      const name = document.getElementById('nr-name').value.trim();
      if(!name) return;
      const color = document.getElementById('nr-color').value.trim() || '#666666';
      const desc = document.getElementById('nr-desc').value.trim();
      const perms = [...document.querySelectorAll('#nr-perms input:checked')].map(c=>c.value);
      DB.roles.push({id:name.toLowerCase().replace(/\s+/g,'_')+'_'+uid(), name, color, perms, order:DB.roles.length, desc});
      await saveKey(K.roles, DB.roles); render();
    };
    const arSubmit = document.getElementById('ar-submit');
    if(arSubmit) arSubmit.onclick = async ()=>{
      const uname = document.getElementById('ar-user').value;
      const rid = document.getElementById('ar-role').value;
      const u = user(uname); if(u){ u.role = rid; await saveKey(K.users, DB.users); if(session.username===uname) session.role=rid; render(); }
    };
    main.querySelectorAll('[data-del-role]').forEach(b=>b.onclick=async()=>{
      DB.roles = DB.roles.filter(r=>r.id!==b.dataset.delRole);
      await saveKey(K.roles, DB.roles); render();
    });
  }

  if(tab==='users'){
    async function sanction(type, target){
      const reason = prompt(`Motif du ${type} pour ${target} :`, '');
      if(reason===null) return;
      DB.logs.push({id:uid(), type, target, moderator:session.username, reason: reason||'Non spécifié', date:now()});
      const u = user(target);
      if(type==='warn') u.warnings.push({reason, date:now()});
      if(type==='ban') u.status='banni';
      await saveKey(K.logs, DB.logs); await saveKey(K.users, DB.users); render();
    }
    main.querySelectorAll('[data-warn]').forEach(b=>b.onclick=()=>sanction('warn', b.dataset.warn));
    main.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>sanction('kick', b.dataset.kick));
    main.querySelectorAll('[data-ban]').forEach(b=>b.onclick=()=>sanction('ban', b.dataset.ban));
    main.querySelectorAll('[data-unban]').forEach(b=>b.onclick=async()=>{
      const u = user(b.dataset.unban); u.status='actif';
      DB.logs.push({id:uid(), type:'kick', target:u.username, moderator:session.username, reason:'Levée du bannissement', date:now()});
      await saveKey(K.users, DB.users); await saveKey(K.logs, DB.logs); render();
    });
  }

  if(tab==='annonces'){
    const submit = document.getElementById('an-submit');
    if(submit) submit.onclick = async ()=>{
      const title = document.getElementById('an-title').value.trim();
      const content = document.getElementById('an-content').value.trim();
      if(!title||!content) return;
      DB.announcements.push({id:uid(), title, content, date:now()});
      await saveKey(K.announcements, DB.announcements); render();
    };
    main.querySelectorAll('[data-del-an]').forEach(b=>b.onclick=async()=>{
      DB.announcements = DB.announcements.filter(a=>a.id!==b.dataset.delAn);
      await saveKey(K.announcements, DB.announcements); render();
    });
  }
}

/* ---------- Démarrage ---------- */
(async function init(){
  document.getElementById('shellArea').innerHTML = '<div style="padding:60px;text-align:center;color:var(--paper-dim);font-family:var(--font-stamp);">Chargement du panneau…</div>';
  await loadAll();
  applyBranding();
  render();
})();
</script>
</body>
