<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site-57 — Espace Membre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0b0d0a;
  --bg-raised:#12140f;
  --paper:#ded7c4;
  --paper-dim:#bcb49c;
  --ink:#1c1a14;
  --amber:#c98a2c;
  --red:#8a2b1f;
  --green:#3c5c3c;
  --blue-grey:#4a4a5c;
  --line: rgba(222,215,196,0.18);
  --line-strong: rgba(222,215,196,0.35);
  --font-stamp:'Courier Prime', monospace;
  --font-body:'Libre Baskerville', serif;
  --font-eyebrow:'Oswald', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 20% 0%, rgba(60,60,45,0.25), transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(40,30,20,0.3), transparent 60%),
    var(--bg);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  line-height:1.5;
}
::selection{background:var(--amber);color:var(--ink);}
a{color:var(--amber);}
button{font-family:var(--font-eyebrow);cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}

.eyebrow{
  font-family:var(--font-eyebrow);
  text-transform:uppercase;
  letter-spacing:0.14em;
  font-size:11px;
  color:var(--amber);
  font-weight:600;
}
.stamp{
  font-family:var(--font-stamp);
  letter-spacing:0.03em;
}

/* ===== Header ===== */
header.top{
  border-bottom:2px solid var(--line-strong);
  background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  padding:18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  position:sticky;
  top:0;
  background-color:var(--bg);
  z-index:50;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .mark{
  width:44px;height:44px;
  border:2px solid var(--amber);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-stamp);
  font-weight:700;
  color:var(--amber);
  font-size:15px;
  position:relative;
}
.brand .mark::after{
  content:"";
  position:absolute;inset:-6px;
  border:1px solid var(--line);
  border-radius:50%;
}
.brand h1{
  font-family:var(--font-eyebrow);
  font-size:20px;
  letter-spacing:0.06em;
  margin:0;
  text-transform:uppercase;
}
.brand small{display:block;font-family:var(--font-stamp);font-size:11px;color:var(--paper-dim);letter-spacing:0.05em;}

.id-card{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--line-strong);
  padding:6px 12px;
  background:rgba(255,255,255,0.03);
}
.id-card .role-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.id-card .who{font-family:var(--font-stamp);font-size:12px;}
.id-card .who b{display:block;font-size:13px;}
.id-card button{
  background:transparent;border:1px solid var(--line-strong);color:var(--paper);
  padding:4px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
}
.id-card button:hover{border-color:var(--amber);color:var(--amber);}

/* ===== Layout ===== */
.shell{display:flex;min-height:calc(100vh - 80px);}
nav.side{
  width:220px;flex:none;
  border-right:1px solid var(--line);
  padding:20px 0;
}
nav.side button{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:transparent;border:none;color:var(--paper-dim);
  padding:10px 22px;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;
  border-left:2px solid transparent;
}
nav.side button .num{font-family:var(--font-stamp);color:var(--amber);font-size:11px;width:16px;}
nav.side button:hover{color:var(--paper);background:rgba(255,255,255,0.02);}
nav.side button.active{color:var(--paper);border-left-color:var(--amber);background:rgba(201,138,44,0.08);font-weight:600;}
nav.side .sep{margin:14px 22px;border-top:1px solid var(--line);}

main{flex:1;padding:32px 40px;max-width:980px;}
.panel-title{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.panel-title h2{font-family:var(--font-eyebrow);text-transform:uppercase;letter-spacing:.05em;font-size:26px;margin:0;}
.panel-sub{color:var(--paper-dim);font-size:13.5px;margin-bottom:26px;font-style:italic;}

.card{
  border:1px solid var(--line-strong);
  background:rgba(255,255,255,0.02);
  padding:18px 20px;margin-bottom:14px;
  position:relative;
}
.card::before{
  content:attr(data-tag);
  position:absolute;top:-1px;right:-1px;
  font-family:var(--font-stamp);font-size:10px;
  background:var(--amber);color:var(--ink);
  padding:2px 8px;letter-spacing:.05em;
  display:var(--show-tag,none);
}
.card[data-tag]{--show-tag:block;}
.card h3{margin:0 0 6px;font-family:var(--font-eyebrow);font-size:16px;text-transform:uppercase;letter-spacing:.03em;}
.card .meta{font-family:var(--font-stamp);font-size:11px;color:var(--paper-dim);margin-bottom:10px;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-stamp);font-size:10.5px;text-transform:uppercase;
  padding:3px 9px;border:1px solid var(--line-strong);letter-spacing:.04em;
}
.badge .dot{width:7px;height:7px;border-radius:50%;}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{
  background:transparent;border:1px solid var(--paper-dim);color:var(--paper);
  padding:8px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:700;}
.btn.primary:hover{background:#e0a248;color:var(--ink);}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:var(--paper);}
.btn.warn{border-color:#b98a1f;color:#d8a53a;}
.btn.warn:hover{background:#b98a1f;color:var(--ink);}
.btn.small{padding:5px 10px;font-size:10.5px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

input[type=text],input[type=password],input[type=number],textarea,select{
  background:rgba(255,255,255,0.04);border:1px solid var(--line-strong);color:var(--paper);
  padding:9px 11px;font-size:13.5px;width:100%;
}
textarea{min-height:90px;resize:vertical;}
label{display:block;font-family:var(--font-eyebrow);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-dim);margin:12px 0 5px;}
.form{border:1px dashed var(--line-strong);padding:18px;margin-bottom:22px;background:rgba(255,255,255,0.015);}
.form-title{font-family:var(--font-stamp);font-size:11.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}

.redacted{
  background:#000;color:#000;padding:0 4px;border-radius:2px;cursor:pointer;
  transition:color .15s;
}
.redacted:hover{color:var(--paper);}

.empty{color:var(--paper-dim);font-style:italic;font-size:13.5px;padding:18px 0;}

.login-wrap{
  min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:40px;
}
.login-card{
  width:380px;border:1px solid var(--line-strong);padding:30px 28px;
  background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
  position:relative;
}
.login-card::before{
  content:"CONFIDENTIEL";
  position:absolute;top:14px;right:-38px;
  transform:rotate(45deg);
  background:var(--red);color:var(--paper);
  font-family:var(--font-stamp);font-size:10px;letter-spacing:.1em;
  padding:3px 46px;
}
.login-card h2{font-family:var(--font-eyebrow);text-transform:uppercase;margin:0 0 4px;font-size:19px;}
.login-card .hint{font-family:var(--font-stamp);font-size:11px;color:var(--paper-dim);margin-bottom:18px;line-height:1.6;}
.tabtoggle{display:flex;margin-bottom:16px;border:1px solid var(--line-strong);}
.tabtoggle button{flex:1;background:transparent;border:none;color:var(--paper-dim);padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
.tabtoggle button.active{background:var(--amber);color:var(--ink);font-weight:700;}
.errmsg{color:#e07a5f;font-family:var(--font-stamp);font-size:11.5px;margin-top:8px;min-height:14px;}

.hier-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);}
.hier-row:last-child{border-bottom:none;}
.hier-rank{font-family:var(--font-stamp);font-size:20px;color:var(--paper-dim);width:36px;}
.hier-swatch{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid var(--line-strong);}
.hier-info h4{margin:0;font-family:var(--font-eyebrow);text-transform:uppercase;font-size:14.5px;letter-spacing:.03em;}
.hier-info p{margin:2px 0 0;font-size:12.5px;color:var(--paper-dim);}
.hier-perms{font-family:var(--font-stamp);font-size:10px;color:var(--amber);margin-top:4px;}

.log-line{
  font-family:var(--font-stamp);font-size:12px;padding:8px 0;border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
}
.log-line .tag{padding:1px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
.tag.ban{background:var(--red);color:var(--paper);}
.tag.kick{background:var(--amber);color:var(--ink);}
.tag.warn{background:#7a6a20;color:var(--paper);}
.log-line .when{color:var(--paper-dim);margin-left:auto;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.block-preview{border:1px solid var(--line);padding:12px;margin-bottom:10px;}
.block-preview img,.block-preview iframe{max-width:100%;display:block;}
.block-preview iframe{width:100%;height:280px;border:none;}

footer.foot{
  border-top:1px solid var(--line);padding:18px 40px;font-family:var(--font-stamp);
  font-size:10.5px;color:var(--paper-dim);text-align:center;letter-spacing:.04em;
}

@media(max-width:820px){
  .shell{flex-direction:column;}
  nav.side{width:100%;display:flex;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--line);}
  nav.side button{width:auto;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;}
  nav.side button.active{border-left:none;border-bottom-color:var(--amber);}
  main{padding:22px 16px;}
  .grid2{grid-template-columns:1fr;}
}

#siteBanner{
  display:none;
  background:var(--red);color:var(--paper);
  font-family:var(--font-stamp);font-size:12px;letter-spacing:.04em;
  text-align:center;padding:8px 16px;
}
</style>
</head>
<body>

<div id="siteBanner"></div>
<header class="top">
  <div class="brand">
    <div class="mark">57</div>
    <div>
      <h1 data-site-name>Site-57</h1>
      <small class="stamp" data-site-tagline>Terminal du personnel — accès restreint</small>
    </div>
  </div>
  <div id="authArea"></div>
</header>

<div class="shell" id="shellArea"></div>

<footer class="foot">Site-57 — Espace Membre · Registre interne · Toute donnée saisie ici est stockée à des fins de démonstration uniquement.</footer>

<script src="site57_core.js"></script>
<script>

/* ===================== NAVIGATION ===================== */
const TABS = [
  {id:'dashboard', num:'', label:'Accueil', always:true},
  {id:'roles', num:'01', label:'Rôles & vérif.'},
  {id:'recrutement', num:'02', label:'Recrutement'},
  {id:'membres', num:'03', label:'Membres'},
  {id:'articles', num:'04', label:'Articles'},
  {id:'annonces', num:'05', label:'Annonces'},
  {id:'idees', num:'06', label:'Idées & avis'},
  {id:'hierarchie', num:'07', label:'Hiérarchie'},
  {id:'boutique', num:'08', label:'Boutique'},
  {id:'archives', num:'09', label:'Page libre'}
];

function setTab(id){ activeTab = id; render(); }

/* ===================== RENDU PRINCIPAL ===================== */
function render(){
  renderAuthArea();
  const shell = document.getElementById('shellArea');
  if(!session){
    shell.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  shell.innerHTML = `
    <nav class="side">
      ${TABS.filter(t=>!t.perm || hasPerm(session, t.perm) || t.always).map(t=>`
        <button data-tab="${t.id}" class="${activeTab===t.id?'active':''}">
          <span class="num">${t.num}</span> ${t.label}
        </button>`).join('')}
      <div class="sep"></div>
      <button data-tab="__logout" style="color:#e07a5f;">↩ Déconnexion</button>
    </nav>
    <main id="mainArea"></main>
  `;
  shell.querySelectorAll('nav.side button').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.dataset.tab==='__logout'){ session=null; render(); return; }
      setTab(b.dataset.tab);
    });
  });
  const main = document.getElementById('mainArea');
  const renderers = {
    dashboard: renderDashboard, roles: renderRoles, recrutement: renderRecrutement,
    membres: renderMembres,
    articles: renderArticles, annonces: renderAnnonces, idees: renderIdees,
    hierarchie: renderHierarchie, boutique: renderBoutique, archives: renderArchives
  };
  main.innerHTML = (renderers[activeTab]||renderDashboard)();
  attachTabHandlers(activeTab);
}

function renderAuthArea(){
  const el = document.getElementById('authArea');
  if(!session){ el.innerHTML=''; return; }
  const r = role(session.role);
  el.innerHTML = `
    <div class="id-card">
      <span class="role-dot" style="background:${r?r.color:'#666'}"></span>
      <span class="who">Connecté :<b>${esc(session.username)}</b></span>
      <span class="badge stamp"><span class="dot" style="background:${r?r.color:'#666'}"></span>${esc(r?r.name:'?')}</span>
      <span class="stamp" style="font-size:11px;color:var(--amber);">◈ ${session.credits ?? 0} cr.</span>
    </div>`;
}

/* ===================== CONNEXION ===================== */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="tabtoggle">
        <button id="lt-login" class="${loginMode==='login'?'active':''}">Connexion</button>
        <button id="lt-register" class="${loginMode==='register'?'active':''}">Inscription</button>
      </div>
      <h2>Terminal du personnel</h2>
      <div class="hint">Compte de démonstration : <b>developeur1234</b> / mot de passe <b>developeur1234</b> (rôle Développeur — tous les droits).<br>La configuration du site et les sanctions se gèrent depuis la page <b>site57_admin.html</b>.</div>
      <label>Identifiant</label>
      <input type="text" id="f-user" placeholder="ex : morpheur_07">
      <label>Mot de passe</label>
      <input type="password" id="f-pass" placeholder="••••••••">
      <div class="row" style="margin-top:16px;">
        <button class="btn primary" id="f-submit" style="flex:1;">${loginMode==='login'?'Se connecter':'Créer le compte'}</button>
      </div>
      <div class="errmsg" id="f-err"></div>
    </div>
  </div>`;
}
function attachLoginHandlers(){
  document.getElementById('lt-login').onclick=()=>{loginMode='login';render();};
  document.getElementById('lt-register').onclick=()=>{loginMode='register';render();};
  document.getElementById('f-submit').onclick=async ()=>{
    const uname = document.getElementById('f-user').value.trim();
    const pass = document.getElementById('f-pass').value;
    const err = document.getElementById('f-err');
    if(!uname || !pass){ err.textContent='Identifiant et mot de passe requis.'; return; }
    if(loginMode==='register'){
      if(user(uname)){ err.textContent='Cet identifiant existe déjà.'; return; }
      const u = {username:uname, password:pass, role:'membre', credits:100, status:'actif', warnings:[], joined:now()};
      DB.users.push(u); await saveKey(K.users, DB.users);
      session = u; render();
    } else {
      const u = user(uname);
      if(!u || u.password!==pass){ err.textContent='Identifiants invalides.'; return; }
      if(u.status==='banni'){ err.textContent='Ce compte est banni. Accès refusé.'; return; }
      session = u; render();
    }
  };
}

/* ===================== ACCUEIL ===================== */
function renderDashboard(){
  const r = role(session.role);
  return `
  <div class="panel-title"><h2>Accueil</h2></div>
  <p class="panel-sub">Bienvenue, ${esc(session.username)}. Voici un résumé de l'activité du site.</p>
  <div class="grid2">
    <div class="card"><h3>Votre statut</h3>
      <p class="meta">Rôle : <span class="badge"><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</span></p>
      <p style="font-size:13px;">${esc(r.desc)}</p>
      <p style="font-size:13px;">Avertissements reçus : <b>${(session.warnings||[]).length}</b></p>
    </div>
    <div class="card"><h3>En bref</h3>
      <p style="font-size:13px;">${DB.articles.length} article(s) · ${DB.announcements.length} annonce(s) · ${DB.recruitment.filter(p=>p.status==='ouvert').length} poste(s) ouvert(s) · ${DB.ideas.length} idée(s) proposée(s)</p>
    </div>
  </div>
  <div class="card"><h3>Dernières annonces</h3>
    ${DB.announcements.slice(-3).reverse().map(a=>`<p style="font-size:13px;margin:6px 0;"><b>${esc(a.title)}</b> — <span style="color:var(--paper-dim)">${a.date}</span></p>`).join('') || '<div class="empty">Aucune annonce pour le moment.</div>'}
  </div>`;
}

/* ===================== 01 — RÔLES & VÉRIFICATION ===================== */
function renderRoles(){
  const canManage = hasPerm(session, 'roles');
  const sorted = [...DB.roles].sort((a,b)=>a.order-b.order);
  return `
  <div class="panel-title"><h2>Rôles &amp; vérification</h2></div>
  <p class="panel-sub">Système de contrôle des accès. Seul le rôle <b>Développeur</b> peut créer ou modifier des rôles.</p>
  ${canManage?`
  <div class="form">
    <div class="form-title">Créer un nouveau rôle</div>
    <label>Nom du rôle</label><input type="text" id="nr-name" placeholder="ex : Archiviste">
    <label>Couleur</label><input type="text" id="nr-color" placeholder="#4a4a6a" value="#4a4a6a">
    <label>Description</label><textarea id="nr-desc" placeholder="Fonction et responsabilités du rôle"></textarea>
    <label>Permissions</label>
    <div class="row" id="nr-perms">
      ${['roles','users','recruitment','articles','announcements','ideas','shop','moderate'].map(p=>`
        <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-family:var(--font-body);font-size:13px;">
          <input type="checkbox" value="${p}" style="width:auto;"> ${p}
        </label>`).join('')}
    </div>
    <button class="btn primary" id="nr-submit" style="margin-top:12px;">Créer le rôle</button>
  </div>`:''}
  <div id="rolesList">
  ${sorted.map(r=>`
    <div class="card">
      <span class="badge" style="position:absolute;top:14px;right:16px;"><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</span>
      <h3>${esc(r.name)}</h3>
      <p class="meta">ID : ${r.id} · Permissions : ${r.perms.includes('all')?'TOUTES':(r.perms.join(', ')||'aucune')}</p>
      <p style="font-size:13px;">${esc(r.desc)}</p>
      ${canManage && r.id!=='developpeur' ? `<button class="btn danger small" data-del-role="${r.id}">Supprimer ce rôle</button>` : ''}
    </div>`).join('')}
  </div>
  <h3 style="font-family:var(--font-eyebrow);text-transform:uppercase;letter-spacing:.04em;margin-top:30px;">Attribuer un rôle</h3>
  ${canManage?`
  <div class="form">
    <div class="row">
      <select id="ar-user" style="flex:2;">${DB.users.map(u=>`<option value="${u.username}">${esc(u.username)}</option>`).join('')}</select>
      <select id="ar-role" style="flex:1;">${DB.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>
      <button class="btn primary" id="ar-submit">Attribuer</button>
    </div>
  </div>`:'<div class="empty">Vous n’avez pas la permission de gérer les rôles.</div>'}
  `;
}

/* ===================== 02 — RECRUTEMENT ===================== */
function renderRecrutement(){
  const canManage = hasPerm(session, 'recruitment');
  return `
  <div class="panel-title"><h2>Recrutement</h2></div>
  <p class="panel-sub">Postes ouverts au sein du site. Postulez ou consultez l'état des candidatures.</p>
  ${canManage?`
  <div class="form">
    <div class="form-title">Ouvrir un nouveau poste</div>
    <label>Intitulé du poste</label><input type="text" id="rp-title" placeholder="ex : Traducteur">
    <label>Description</label><textarea id="rp-desc" placeholder="Missions et attentes"></textarea>
    <button class="btn primary" id="rp-submit" style="margin-top:10px;">Publier le poste</button>
  </div>`:''}
  ${DB.recruitment.slice().reverse().map(p=>`
    <div class="card">
      <span class="badge" style="position:absolute;top:14px;right:16px;background:${p.status==='ouvert'?'rgba(60,92,60,0.3)':'rgba(138,43,31,0.3)'};border-color:${p.status==='ouvert'?'var(--green)':'var(--red)'};">${p.status==='ouvert'?'OUVERT':'FERMÉ'}</span>
      <h3>${esc(p.roleTitle)}</h3>
      <p class="meta">Publié par ${esc(p.createdBy)} · ${p.applications.length} candidature(s)</p>
      <p style="font-size:13px;">${esc(p.desc)}</p>
      <div class="row">
        ${p.status==='ouvert' && !p.applications.some(a=>a.username===session.username) ? `<button class="btn small" data-apply="${p.id}">Postuler</button>` : ''}
        ${canManage ? `<button class="btn small warn" data-toggle-post="${p.id}">${p.status==='ouvert'?'Fermer le poste':'Rouvrir le poste'}</button>
        <button class="btn small danger" data-del-post="${p.id}">Supprimer</button>` : ''}
      </div>
      ${canManage && p.applications.length>0 ? `
        <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;">
          ${p.applications.map(a=>`
            <div style="font-size:12.5px;margin-bottom:6px;">
              <b>${esc(a.username)}</b> : ${esc(a.message)}
              <span style="color:var(--amber);font-family:var(--font-stamp);font-size:10.5px;text-transform:uppercase;"> — ${a.status}</span>
              ${a.status==='en attente'?`
                <button class="btn small" data-accept-app="${p.id}|${a.username}">Accepter</button>
                <button class="btn small danger" data-reject-app="${p.id}|${a.username}">Refuser</button>`:''}
            </div>`).join('')}
        </div>`:''}
    </div>`).join('') || '<div class="empty">Aucun poste publié.</div>'}
  `;
}

/* ===================== 03 — MEMBRES ===================== */
let membresFilterRole = '';
let membresSearch = '';
function renderMembres(){
  const canModerate = hasPerm(session, 'moderate');
  const sortedRoles = [...DB.roles].sort((a,b)=>a.order-b.order);
  let list = DB.users.filter(u=>{
    const matchRole = !membresFilterRole || u.role===membresFilterRole;
    const matchSearch = !membresSearch || u.username.toLowerCase().includes(membresSearch.toLowerCase());
    return matchRole && matchSearch;
  }).sort((a,b)=>{
    const ra = role(a.role)?.order ?? 99, rb = role(b.role)?.order ?? 99;
    return ra-rb || a.username.localeCompare(b.username);
  });
  return `
  <div class="panel-title"><h2>Membres</h2></div>
  <p class="panel-sub">Annuaire du personnel de Site-57 — ${DB.users.length} compte(s) enregistré(s).</p>
  <div class="row" style="margin-bottom:20px;">
    <input type="text" id="mb-search" placeholder="Rechercher un identifiant…" value="${esc(membresSearch)}" style="flex:2;">
    <select id="mb-role" style="flex:1;">
      <option value="">Tous les rôles</option>
      ${sortedRoles.map(r=>`<option value="${r.id}" ${membresFilterRole===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
    </select>
  </div>
  <div class="grid2">
  ${list.map(u=>{
    const r = role(u.role);
    const isSelf = u.username===session.username;
    return `
    <div class="card" ${u.status==='banni'?'style="opacity:.55;"':''}>
      <span class="badge" style="position:absolute;top:14px;right:16px;${u.status==='banni'?'border-color:var(--red);color:var(--red);':''}">${u.status.toUpperCase()}</span>
      <h3>${esc(u.username)}${isSelf?' <span style="color:var(--amber);font-family:var(--font-stamp);font-size:11px;">(vous)</span>':''}</h3>
      <p class="meta">
        <span class="badge"><span class="dot" style="background:${r?r.color:'#666'}"></span>${esc(r?r.name:'?')}</span>
        · Inscrit le ${u.joined}
      </p>
      <p style="font-size:12.5px;color:var(--paper-dim);">◈ ${u.credits} crédits · ${u.warnings.length} avertissement(s)</p>
      <div class="row" style="margin-top:10px;">
        <button class="btn small" data-view-page="${u.username}">Voir sa page libre</button>
        ${canModerate && !isSelf && u.status!=='banni' ? `<button class="btn small warn" data-mb-warn="${u.username}">Avertir</button>` : ''}
        ${canModerate && !isSelf ? `<button class="btn small danger" data-mb-ban="${u.username}" ${u.status==='banni'?'disabled':''}>Bannir</button>` : ''}
      </div>
    </div>`;
  }).join('') || '<div class="empty">Aucun membre ne correspond à cette recherche.</div>'}
  </div>`;
}

let archivesViewUser = null;

/* ===================== GESTIONNAIRES D'ÉVÉNEMENTS ===================== */
function attachTabHandlers(tab){
  const main = document.getElementById('mainArea');

  if(tab==='roles'){
    const submit = document.getElementById('nr-submit');
    if(submit) submit.onclick = async ()=>{
      const name = document.getElementById('nr-name').value.trim();
      if(!name) return;
      const color = document.getElementById('nr-color').value.trim() || '#666666';
      const desc = document.getElementById('nr-desc').value.trim();
      const perms = [...document.querySelectorAll('#nr-perms input:checked')].map(c=>c.value);
      DB.roles.push({id:name.toLowerCase().replace(/\s+/g,'_')+'_'+uid(), name, color, perms, order:DB.roles.length, desc});
      await saveKey(K.roles, DB.roles); render();
    };
    main.querySelectorAll('[data-del-role]').forEach(b=>b.onclick=async()=>{
      DB.roles = DB.roles.filter(r=>r.id!==b.dataset.delRole);
      await saveKey(K.roles, DB.roles); render();
    });
    const arSubmit = document.getElementById('ar-submit');
    if(arSubmit) arSubmit.onclick = async ()=>{
      const uname = document.getElementById('ar-user').value;
      const rid = document.getElementById('ar-role').value;
      const u = user(uname); if(u){ u.role = rid; await saveKey(K.users, DB.users); if(session.username===uname) session.role=rid; render(); }
    };
  }

  if(tab==='recrutement'){
    const submit = document.getElementById('rp-submit');
    if(submit) submit.onclick = async ()=>{
      const roleTitle = document.getElementById('rp-title').value.trim();
      const desc = document.getElementById('rp-desc').value.trim();
      if(!roleTitle) return;
      DB.recruitment.push({id:uid(), roleTitle, desc, status:'ouvert', createdBy:session.username, applications:[]});
      await saveKey(K.recruitment, DB.recruitment); render();
    };
    main.querySelectorAll('[data-apply]').forEach(b=>b.onclick=async()=>{
      const msg = prompt('Message de motivation :') || '';
      const post = DB.recruitment.find(p=>p.id===b.dataset.apply);
      post.applications.push({username:session.username, message:msg, status:'en attente'});
      await saveKey(K.recruitment, DB.recruitment); render();
    });
    main.querySelectorAll('[data-toggle-post]').forEach(b=>b.onclick=async()=>{
      const post = DB.recruitment.find(p=>p.id===b.dataset.togglePost);
      post.status = post.status==='ouvert'?'fermé':'ouvert';
      await saveKey(K.recruitment, DB.recruitment); render();
    });
    main.querySelectorAll('[data-del-post]').forEach(b=>b.onclick=async()=>{
      DB.recruitment = DB.recruitment.filter(p=>p.id!==b.dataset.delPost);
      await saveKey(K.recruitment, DB.recruitment); render();
    });
    main.querySelectorAll('[data-accept-app]').forEach(b=>b.onclick=async()=>{
      const [pid, uname] = b.dataset.acceptApp.split('|');
      const post = DB.recruitment.find(p=>p.id===pid);
      const app = post.applications.find(a=>a.username===uname);
      app.status='acceptée';
      await saveKey(K.recruitment, DB.recruitment); render();
    });
    main.querySelectorAll('[data-reject-app]').forEach(b=>b.onclick=async()=>{
      const [pid, uname] = b.dataset.rejectApp.split('|');
      const post = DB.recruitment.find(p=>p.id===pid);
      const app = post.applications.find(a=>a.username===uname);
      app.status='refusée';
      await saveKey(K.recruitment, DB.recruitment); render();
    });
  }

  if(tab==='membres'){
    document.getElementById('mb-search').oninput = (e)=>{ membresSearch = e.target.value; render(); };
    document.getElementById('mb-role').onchange = (e)=>{ membresFilterRole = e.target.value; render(); };
    main.querySelectorAll('[data-view-page]').forEach(b=>b.onclick=()=>{
      archivesViewUser = b.dataset.viewPage; setTab('archives');
    });
    main.querySelectorAll('[data-mb-warn]').forEach(b=>b.onclick=async()=>{
      const target = b.dataset.mbWarn;
      const reason = prompt(`Motif de l'avertissement pour ${target} :`, '');
      if(reason===null) return;
      const u = user(target);
      u.warnings.push({reason, date:now()});
      DB.logs.push({id:uid(), type:'warn', target, moderator:session.username, reason: reason||'Non spécifié', date:now()});
      await saveKey(K.users, DB.users); await saveKey(K.logs, DB.logs); render();
    });
    main.querySelectorAll('[data-mb-ban]').forEach(b=>b.onclick=async()=>{
      const target = b.dataset.mbBan;
      const reason = prompt(`Motif du bannissement pour ${target} :`, '');
      if(reason===null) return;
      const u = user(target); u.status='banni';
      DB.logs.push({id:uid(), type:'ban', target, moderator:session.username, reason: reason||'Non spécifié', date:now()});
      await saveKey(K.users, DB.users); await saveKey(K.logs, DB.logs); render();
    });
  }

  if(tab==='articles'){
    const submit = document.getElementById('art-submit');
    if(submit) submit.onclick = async ()=>{
      const title = document.getElementById('art-title').value.trim();
      const content = document.getElementById('art-content').value.trim();
      if(!title||!content) return;
      DB.articles.push({id:uid(), title, content, author:session.username, date:now()});
      await saveKey(K.articles, DB.articles); render();
    };
    main.querySelectorAll('[data-del-art]').forEach(b=>b.onclick=async()=>{
      DB.articles = DB.articles.filter(a=>a.id!==b.dataset.delArt);
      await saveKey(K.articles, DB.articles); render();
    });
  }

  if(tab==='annonces'){
    const submit = document.getElementById('an-submit');
    if(submit) submit.onclick = async ()=>{
      const title = document.getElementById('an-title').value.trim();
      const content = document.getElementById('an-content').value.trim();
      if(!title||!content) return;
      DB.announcements.push({id:uid(), title, content, date:now()});
      await saveKey(K.announcements, DB.announcements); render();
    };
    main.querySelectorAll('[data-del-an]').forEach(b=>b.onclick=async()=>{
      DB.announcements = DB.announcements.filter(a=>a.id!==b.dataset.delAn);
      await saveKey(K.announcements, DB.announcements); render();
    });
  }

  if(tab==='idees'){
    const submit = document.getElementById('id-submit');
    if(submit) submit.onclick = async ()=>{
      const title = document.getElementById('id-title').value.trim();
      const content = document.getElementById('id-content').value.trim();
      if(!title||!content) return;
      DB.ideas.push({id:uid(), title, content, author:session.username, votes:0, comments:[]});
      await saveKey(K.ideas, DB.ideas); render();
    };
    main.querySelectorAll('[data-vote]').forEach(b=>b.onclick=async()=>{
      const idea = DB.ideas.find(i=>i.id===b.dataset.vote);
      idea.votes++;
      await saveKey(K.ideas, DB.ideas); render();
    });
    main.querySelectorAll('[data-comment]').forEach(b=>b.onclick=async()=>{
      const idea = DB.ideas.find(i=>i.id===b.dataset.comment);
      const input = document.getElementById('cm-'+idea.id);
      const text = input.value.trim();
      if(!text) return;
      idea.comments.push({author:session.username, text});
      await saveKey(K.ideas, DB.ideas); render();
    });
  }

  if(tab==='hierarchie'){
    main.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{
      const [rid, dir] = b.dataset.move.split('|');
      const sorted = [...DB.roles].sort((a,b)=>a.order-b.order);
      const idx = sorted.findIndex(r=>r.id===rid);
      const swapIdx = dir==='up'?idx-1:idx+1;
      if(swapIdx<0||swapIdx>=sorted.length) return;
      const tmp = sorted[idx].order;
      sorted[idx].order = sorted[swapIdx].order;
      sorted[swapIdx].order = tmp;
      await saveKey(K.roles, DB.roles); render();
    });
  }

  if(tab==='boutique'){
    const submit = document.getElementById('sh-submit');
    if(submit) submit.onclick = async ()=>{
      const name = document.getElementById('sh-name').value.trim();
      const price = parseInt(document.getElementById('sh-price').value)||0;
      const desc = document.getElementById('sh-desc').value.trim();
      if(!name) return;
      DB.shop.push({id:uid(), name, price, desc});
      await saveKey(K.shop, DB.shop); render();
    };
    main.querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{
      const item = DB.shop.find(i=>i.id===b.dataset.buy);
      if(session.credits<item.price) return;
      session.credits -= item.price;
      const u = user(session.username); u.credits = session.credits;
      DB.purchases.push({id:uid(), username:session.username, item:item.name, date:now()});
      await saveKey(K.users, DB.users); await saveKey(K.purchases, DB.purchases); render();
    });
    main.querySelectorAll('[data-del-item]').forEach(b=>b.onclick=async()=>{
      DB.shop = DB.shop.filter(i=>i.id!==b.dataset.delItem);
      await saveKey(K.shop, DB.shop); render();
    });
  }

  if(tab==='archives'){
    document.getElementById('arch-select').onchange = (e)=>{ archivesViewUser = e.target.value; render(); };
    const submit = document.getElementById('pg-submit');
    if(submit) submit.onclick = async ()=>{
      const type = document.getElementById('pg-type').value;
      const content = document.getElementById('pg-content').value.trim();
      if(!content) return;
      if(!DB.pages[session.username]) DB.pages[session.username]=[];
      DB.pages[session.username].push({type, content});
      await saveKey(K.pages, DB.pages); render();
    };
    main.querySelectorAll('[data-del-block]').forEach(b=>b.onclick=async()=>{
      const i = parseInt(b.dataset.delBlock);
      DB.pages[session.username].splice(i,1);
      await saveKey(K.pages, DB.pages); render();
    });
  }

}

  await loadAll();
